[workspace]
resolver = "3"
members = [
    "crates/qml-core",
    "crates/qml-hardware",
    "crates/qml-format",
    "crates/qml-model",
    "crates/qml-scope",
    "crates/qml-quant",
    "crates/qml-forge",
    "crates/qml-runtime",
    "crates/qml-behavior",
    "crates/qml-tokenizer",
    "crates/qml-genesis",
    "crates/qml-cli",
    "crates/qml-desktop",
]

[workspace.package]
edition = "2024"
version = "0.5.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
