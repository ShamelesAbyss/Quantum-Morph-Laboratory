# ==============================================================================
# 3. SmolLM2-360M-Instruct — Layer-31 Selective Precision Protection Study (GPU)
# ==============================================================================

[layer31_protection_study]
model = "HuggingFaceTB/SmolLM2-360M-Instruct"
prompt = "Explain singular value decomposition in two sentences."
tokens_evaluated = 8
layers = 32
hypothesis = "Promoting Layer 31 (identified as the sharp Rel L2=0.6002 / RSA=0.5697 cliff in exp-003) from Q4_0 to INT8_SYM will eliminate Layer-31 activation drift and reduce output KL divergence."

[layer31_protection_study.uniform_q4_0]
qmf_bytes = 203805958
complete_qmf_bpp = 4.506
l30_cos = 0.9764
l30_rel_l2 = 0.2038
l30_rsa = 0.9813
l31_cos = 0.9064
l31_min_cos = 0.5741
l31_rel_l2 = 0.6002
l31_rsa = 0.5697
mean_kl_vs_bf16 = 1.28366
top1_agreement = 0.250

[layer31_protection_study.layer31_protected_int8]
method = "behavior_protected (--method q4-protect --protect-layers 31)"
qmf_bytes = 208413968
complete_qmf_bpp = 4.608
bpp_overhead = 0.102
mean_matvec_rel_error = 0.09848
l30_cos = 0.9764
l30_rel_l2 = 0.2038
l30_rsa = 0.9813
l31_cos = 0.9114
l31_min_cos = 0.5853
l31_rel_l2 = 0.4560
l31_rsa = 0.4549
mean_kl_vs_bf16 = 1.49900
top1_agreement = 0.250
finding = "NUANCED/PARTIAL NEGATIVE CONTROL: Promoting Layer 31 to INT8_SYM (+0.102 bpp) reduced Layer-31 relative L2 drift by -24.0% (0.6002 -> 0.4560) and raised Layer-31 cosine (0.9064 -> 0.9114), confirming Layer 31's own weights account for ~24% of the L31 spike. However, L31 RSA fell (0.5697 -> 0.4549) and output Mean KL increased slightly (1.28366 -> 1.49900). This falsifies the naive single-layer-fix hypothesis and proves the Layer-31 cliff is predominantly upstream-amplified (accumulated L00-L30 residual drift entering Layer 31's high-gain final projection plus tied embed_tokens/lm_head quantization), motivating activation-aware Hessian/GPTQ compensation in Wave II."
