[workspace]
resolver = "3"
members = [
    "crates/qml-core",
    "crates/qml-format",
    "crates/qml-model",
    "crates/qml-scope",
    "crates/qml-cli",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
