[package]
name = "qml-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "qml-desktop"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_plot = "0.31"
qml-behavior = { path = "../qml-behavior" }
qml-core = { path = "../qml-core" }
qml-forge = { path = "../qml-forge" }
qml-format = { path = "../qml-format" }
qml-genesis = { path = "../qml-genesis" }
qml-hardware = { path = "../qml-hardware" }
qml-model = { path = "../qml-model" }
qml-quant = { path = "../qml-quant" }
qml-runtime = { path = "../qml-runtime" }
qml-scope = { path = "../qml-scope" }
qml-tokenizer = { path = "../qml-tokenizer" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
