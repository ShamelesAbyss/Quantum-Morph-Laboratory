<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060C"/>
      <stop offset="50%" stop-color="#0B0918"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <radialGradient id="uvGlow" cx="24%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#6D28D9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#07080F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="78%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#0891B2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07080F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="52%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="25%" stop-color="#A855F7"/>
      <stop offset="75%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E1B3A" stroke-width="0.6" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Obsidian canvas & precision grid -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="16" fill="url(#uvGlow)"/>
  <rect width="1200" height="360" rx="16" fill="url(#cyanGlow)"/>
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#accentLine)" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Left geometric tensor-network emblem (Shared Latent Manifold) -->
  <g transform="translate(155, 172)" filter="url(#glow)">
    <!-- Outer orbital rings -->
    <ellipse cx="0" cy="0" rx="88" ry="34" fill="none" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.65" transform="rotate(-28)"/>
    <ellipse cx="0" cy="0" rx="88" ry="34" fill="none" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.65" transform="rotate(28)"/>
    <circle cx="0" cy="0" r="64" fill="none" stroke="#6366F1" stroke-width="0.9" stroke-dasharray="4 5" stroke-opacity="0.55"/>

    <!-- Tensor contraction edges -->
    <g stroke="#A855F7" stroke-opacity="0.55" stroke-width="1.1">
      <line x1="-58" y1="-34" x2="0" y2="0"/>
      <line x1="-58" y1="34" x2="0" y2="0"/>
      <line x1="58" y1="-34" x2="0" y2="0"/>
      <line x1="58" y1="34" x2="0" y2="0"/>
      <line x1="0" y1="-64" x2="0" y2="0"/>
      <line x1="0" y1="64" x2="0" y2="0"/>
      <line x1="-58" y1="-34" x2="0" y2="-64"/>
      <line x1="0" y1="-64" x2="58" y2="-34"/>
      <line x1="58" y1="-34" x2="58" y2="34"/>
      <line x1="58" y1="34" x2="0" y2="64"/>
      <line x1="0" y1="64" x2="-58" y2="34"/>
      <line x1="-58" y1="34" x2="-58" y2="-34"/>
    </g>

    <!-- Tensor nodes -->
    <circle cx="-58" cy="-34" r="5.5" fill="#A855F7"/>
    <circle cx="58" cy="-34" r="5.5" fill="#22D3EE"/>
    <circle cx="-58" cy="34" r="5.5" fill="#6366F1"/>
    <circle cx="58" cy="34" r="5.5" fill="#38BDF8"/>
    <circle cx="0" cy="-64" r="5.5" fill="#C084FC"/>
    <circle cx="0" cy="64" r="5.5" fill="#67E8F9"/>

    <!-- Shared latent core S -->
    <polygon points="0,-19 16.5,-9.5 16.5,9.5 0,19 -16.5,9.5 -16.5,-9.5" fill="#0F0B24" stroke="#22D3EE" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#E0F2FE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">S</text>
  </g>

  <!-- Right spectral singular-value decay curve -->
  <g transform="translate(940, 88)" opacity="0.88">
    <rect x="0" y="0" width="210" height="172" rx="10" fill="#0A0C18" fill-opacity="0.72" stroke="#2E2656" stroke-width="1"/>
    <text x="14" y="22" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2">SPECTRAL MANIFOLD</text>
    <!-- Singular value bars -->
    <rect x="18" y="42" width="12" height="92" rx="2" fill="#A855F7"/>
    <rect x="36" y="64" width="12" height="70" rx="2" fill="#9333EA"/>
    <rect x="54" y="82" width="12" height="52" rx="2" fill="#7C3AED"/>
    <rect x="72" y="96" width="12" height="38" rx="2" fill="#6366F1"/>
    <rect x="90" y="108" width="12" height="26" rx="2" fill="#3B82F6"/>
    <rect x="108" y="116" width="12" height="18" rx="2" fill="#0EA5E9"/>
    <rect x="126" y="122" width="12" height="12" rx="2" fill="#06B6D4"/>
    <rect x="144" y="126" width="12" height="8" rx="2" fill="#22D3EE"/>
    <rect x="162" y="129" width="12" height="5" rx="2" fill="#67E8F9"/>
    <rect x="180" y="131" width="12" height="3" rx="2" fill="#A5F3FC"/>
    <!-- Decay envelope -->
    <path d="M 24 40 Q 64 88 186 129" fill="none" stroke="url(#waveGrad)" stroke-width="2" filter="url(#glow)"/>
    <text x="14" y="156" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Wₗ ≈ U · Cₗ · Vᵀ + Rₗ</text>
  </g>

  <!-- Central Brand Identity -->
  <g transform="translate(295, 92)">
    <rect x="0" y="0" width="244" height="24" rx="12" fill="#171230" stroke="#7C3AED" stroke-width="1"/>
    <circle cx="15" cy="12" r="4" fill="#22D3EE" filter="url(#glow)"/>
    <text x="27" y="16" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.4">PURE SAFE RUST · LOCAL-FIRST</text>

    <text x="0" y="74" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="1.5">QUANTUM MORPH</text>
    <text x="0" y="114" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="6">LABORATORY</text>

    <line x1="0" y1="132" x2="585" y2="132" stroke="url(#accentLine)" stroke-width="1.5"/>

    <text x="0" y="162" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-style="italic" font-weight="500">
      Don&#8217;t just compress intelligence. Transform its representation.
    </text>

    <!-- Subsystem pill bar -->
    <g transform="translate(0, 184)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">
      <rect x="0" y="0" width="76" height="24" rx="6" fill="#11152A" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="38" y="15.5" text-anchor="middle" fill="#67E8F9">Q-SCOPE</text>

      <rect x="84" y="0" width="56" height="24" rx="6" fill="#1A1130" stroke="#A855F7" stroke-opacity="0.6"/>
      <text x="112" y="15.5" text-anchor="middle" fill="#D8B4FE">RMQ</text>

      <rect x="148" y="0" width="54" height="24" rx="6" fill="#1A1130" stroke="#A855F7" stroke-opacity="0.6"/>
      <text x="175" y="15.5" text-anchor="middle" fill="#D8B4FE">MAP</text>

      <rect x="210" y="0" width="74" height="24" rx="6" fill="#11152A" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="247" y="15.5" text-anchor="middle" fill="#67E8F9">QMF v1</text>

      <rect x="292" y="0" width="78" height="24" rx="6" fill="#11152A" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="331" y="15.5" text-anchor="middle" fill="#67E8F9">Q-FORGE</text>

      <rect x="378" y="0" width="74" height="24" rx="6" fill="#1A1130" stroke="#A855F7" stroke-opacity="0.6"/>
      <text x="415" y="15.5" text-anchor="middle" fill="#D8B4FE">Q-CORE</text>

      <rect x="460" y="0" width="90" height="24" rx="6" fill="#11152A" stroke="#22D3EE" stroke-opacity="0.6"/>
      <text x="505" y="15.5" text-anchor="middle" fill="#67E8F9">Q-GENESIS</text>
    </g>
  </g>
</svg>
