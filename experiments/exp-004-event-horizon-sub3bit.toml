# Experiment Record: exp-004 — PROJECT RESONANCE & EVENT HORIZON Wave I
# Complete-Artifact Sub-3-Bit Compression Research Ladder (3.00 -> 1.50 bpp),
# Matched-Byte Hadamard Incoherence Ablation, and Layer-31 Selective Protection Study.
# All numbers below were measured directly from `qml.exe --release` on Windows 11 x86_64.
# Pretrained model weights are stored strictly outside Git (Apache-2.0 source checkpoints).

[experiment]
id = "exp-004-event-horizon-sub3bit"
title = "Sub-3-Bit Compression Research Ladder, Matched-Byte Hadamard Incoherence Control & Layer-31 Selective Protection on SmolLM2-135M and SmolLM2-360M"
date = "2026-11-26"
milestone = "v0.4.0 — PROJECT RESONANCE & EVENT HORIZON Wave I"
host_os = "Windows 11 Home (26H2) x86_64"
host_cpu = "Intel Core i9-14900HX (32 logical cores, SSE4.2/AVX/AVX2/FMA/F16C)"
