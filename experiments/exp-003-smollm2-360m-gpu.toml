# Experiment Record: exp-003 — PROJECT ACCELERATION (Persistent GPU-Resident Q-Core on SmolLM2-135M & SmolLM2-360M)
# All numbers below were measured directly from `qml.exe --release` on Windows 11 x86_64.
# Pretrained model weights are stored strictly outside Git (Apache-2.0 source checkpoints).

[experiment]
id = "exp-003-smollm2-360m-gpu"
title = "Persistent GPU-Resident Compressed Q-Core Inference on SmolLM2-135M & SmolLM2-360M-Instruct"
