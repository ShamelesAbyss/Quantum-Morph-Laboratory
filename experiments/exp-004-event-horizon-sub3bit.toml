rust_toolchain = "rustc 1.100.0 (x86_64-pc-windows-msvc)"
evaluation_suite = "Held-out 4-category Capability Retention Suite (Reasoning, Coding, Knowledge, InstructionFollowing; 176 next-token positions across 4 multi-domain prompts)"
bpp_accounting = "Complete on-disk QMF v1 artifact size * 8 / total_parameters (including scales, mins, codebooks, recovery adapters, JSON manifest, alignment, and CRC-32)"

