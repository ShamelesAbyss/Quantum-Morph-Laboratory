name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing version tag
        required: true
        type: string
      prerelease:
        description: Only with explicit owner authorization
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  ALLOW_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
  SIGN_RELEASES: ${{ vars.QML_SIGN_RELEASES == 'true' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate exact source and release contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          rustc --edition=2024 -D warnings scripts/release_contract.rs -o target/release-contract.exe
          target/release-contract.exe validate . "$RELEASE_TAG" "$(git rev-parse HEAD)"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - name: Package desktop, CLI and complete offline documentation
        shell: pwsh
        run: ./scripts/package-release.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --version 0.21.0 --locked
      - run: cargo deny check
  assemble:
    needs: [build, dependency-policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Archive source and prepare integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          rustc --edition=2024 -D warnings scripts/release_contract.rs -o target/release-contract
          target/release-contract validate . "$RELEASE_TAG" "$(git rev-parse HEAD)"
          git archive --format=tar --prefix="Quantum-Morph-Laboratory-$RELEASE_TAG-Source/" HEAD | gzip -n > "dist/Quantum-Morph-Laboratory-$RELEASE_TAG-Source.tar.gz"
          target/release-contract prepare dist "$RELEASE_TAG" "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: assembled-release
          path: dist/*
          if-no-files-found: error
  sign:
    if: vars.QML_SIGN_RELEASES == 'true'
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assembled-release
          path: dist
      - uses: sigstore/cosign-installer@v3
      - name: Require tagged workflow identity for signing
        shell: bash
        run: test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
      - run: cosign sign-blob --yes --bundle dist/RELEASE_MANIFEST.sigstore.json dist/RELEASE_MANIFEST.json
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-signature
          path: dist/RELEASE_MANIFEST.sigstore.json
          if-no-files-found: error
  publish:
    if: always() && needs.assemble.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    needs: [assemble, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: assembled-release
          path: dist
      - uses: actions/download-artifact@v4
        if: env.SIGN_RELEASES == 'true'
        with:
          name: manifest-signature
          path: dist
      - uses: sigstore/cosign-installer@v3
        if: env.SIGN_RELEASES == 'true'
      - name: Verify configured signature
        if: env.SIGN_RELEASES == 'true'
        shell: bash
        run: |
          cosign verify-blob --bundle dist/RELEASE_MANIFEST.sigstore.json --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/RELEASE_MANIFEST.json
      - name: Verify and publish a new native Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          rustc --edition=2024 -D warnings scripts/release_contract.rs -o target/release-contract
          target/release-contract validate . "$RELEASE_TAG" "$(git rev-parse HEAD)"
          target/release-contract checksums dist "$RELEASE_TAG" "$(git rev-parse HEAD)"
          target/release-contract verify dist "$RELEASE_TAG" "$(git rev-parse HEAD)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > existing-release-tags.txt
          if grep -Fxq -- "$RELEASE_TAG" existing-release-tags.txt; then
            echo "Release already exists; refusing to modify it."
            exit 1
          fi
          title=$(head -n 1 RELEASE_NOTES.md | sed 's/^# //' | tr -d '\r')
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$title" --notes-file RELEASE_NOTES.md dist/*
          pre=false
          latest=true
          if [ "$ALLOW_PRERELEASE" = true ]; then pre=true; latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$pre" --latest="$latest"
  verify-public:
    if: always() && needs.publish.result == 'success'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: sigstore/cosign-installer@v3
        if: env.SIGN_RELEASES == 'true'
      - name: Independently verify public assets without authentication
        shell: pwsh
        run: ./scripts/verify-public-release.ps1 -Tag $env:RELEASE_TAG -Commit (git rev-parse HEAD) -Repository $env:GITHUB_REPOSITORY
