[experiment]
id = "exp-006"
title = "PROJECT EVENT HORIZON Wave III: Stage D Qwen2.5-7B-Instruct (14.19 GiB BF16 -> 1.63-3.71 GiB VRAM), Breaking the 2.000 bpp Barrier, Layer-by-Layer Streaming Calibration (<450 MiB VRAM), GPU INT8 KV-Cache & MATVEC_VQ_WGSL Control"
date = "2026-11-26"
version = "0.6.0"
status = "completed"
host_os = "Windows 11 Home (26H2) x86_64"
host_cpu = "Intel Core i9-14900HX (32 logical cores, AVX2/FMA/F16C)"
host_ram_gib = 31.78
host_gpu = "NVIDIA GeForce RTX 4070 Laptop GPU (8 GB VRAM, WGPU Vulkan/DX12)"
rust_toolchain = "1.100.0"

[methodology]
complete_byte_accounting = "Every byte serialized on disk in QMF v1 (payload codes, FP16 scales/mins, codebooks, optional biases, 1D RMSNorm vectors, JSON manifest, headers, CRC-32) divided by total model parameters."
disjoint_calibration_corpus = "6 multi-domain prompts (196 tokens: OS scheduling, Cholesky linear algebra, Python quicksort, photosynthesis, Raft consensus, geometry), strictly disjoint from the 4-category held-out Capability Retention Suite."
streaming_calibration = "Layer-by-layer BF16 streaming (qml-runtime::streaming::stream_calibrate_and_reference) holding at most 1 transformer block (~444.5 MiB) or <=32,768-row lm_head slice in VRAM at any instant, allowing 14.19 GiB BF16 calibration & exact reference logit evaluation on an 8 GB VRAM GPU."
kv_cache_mode = "GPU-resident per-head symmetric INT8 KV-cache (ROPE_AND_KV_APPEND_INT8_WGSL + GQA_ATTN_INT8_WGSL, ~3.88x smaller KV VRAM than FP32) inside single-submission QCoreBackend::GpuFull."

