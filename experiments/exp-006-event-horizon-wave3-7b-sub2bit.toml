scientific_conclusion = "Even with Hadamard rotation, activation-weighted 2-stage k-means++ codebooks, and joint alternating code refinement, uncompensated 2-stage RVQ (KL=9.865 at 2.180 bpp; KL=10.336 at 1.790 bpp) dramatically trails Cholesky-compensated INT2_HADAMARD_GPTQ (KL=2.811, PPLx=13.53x at 2.270 bpp) and even Cholesky-compensated TERNARY_HADAMARD_GPTQ (KL=5.397, PPLx=161.98x at 1.738 bpp) — proving second-order Hessian error compensation (H^-1) dominates non-uniform codebook geometry alone and directly motivating Hessian-compensated lattice/trellis quantization in Wave IV."
