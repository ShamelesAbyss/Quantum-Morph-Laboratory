[package]
name = "qml-format"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
qml-core = { path = "../qml-core" }
qml-model = { path = "../qml-model" }
qml-quant = { path = "../qml-quant" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
tempfile = "3"

[lints]
workspace = true
