# Experiment Record: exp-005 — PROJECT EVENT HORIZON Wave II
# Activation-Aware Blockwise Cholesky GPTQ + Hadamard Incoherence, Full GPU-Resident
# Single-Submission WGSL Execution (`GpuFull`), Qwen2 Attention-Bias Support, and
# Progressive Scaling Across Stage A (360M), Stage B (1.5B & 1.7B), and Stage C (2-Shard 3B).
# All numbers below were measured directly from `qml.exe --release` on Windows 11 x86_64.
# Pretrained model weights are stored strictly outside Git (Apache-2.0 source checkpoints).

[experiment]
id = "exp-005-event-horizon-wave2-gptq-scaling"
title = "Activation-Calibrated Blockwise Cholesky GPTQ + Hadamard & Single-Submission Full GPU-Resident Inference Across 360M, 1.5B, 1.7B, and 2-Shard 3B Pretrained LLMs"
date = "2026-11-26"
milestone = "v0.5.0 — PROJECT EVENT HORIZON Wave II"
host_os = "Windows 11 Home (26H2) x86_64"
host_cpu = "Intel Core i9-14900HX (32 logical cores, SSE4.2/AVX/AVX2/FMA/F16C)"
host_gpu = "NVIDIA GeForce RTX 4070 Laptop GPU (8 GB VRAM, WGPU Vulkan)"
host_ram_gb = 32
rust_toolchain = "rustc 1.100.0 (x86_64-pc-windows-msvc)"
calibration_corpus = "6 disjoint multi-domain passages (196 tokens: OS scheduling, Cholesky factorization, Python quicksort, photosynthesis, Raft consensus, geometry) — strictly separate from held-out evaluation prompts"
hessian_block_size = 64
evaluation_suite = "Held-out 4-category Capability Retention Suite (Reasoning, Coding, Knowledge, InstructionFollowing)"
bpp_accounting = "Complete on-disk QMF v1 artifact size * 8 / total_parameters (including scales, mins, biases, JSON manifest, alignment, and CRC-32)"

