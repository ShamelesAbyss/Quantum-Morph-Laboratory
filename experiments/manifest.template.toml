# Copy this file for an actual experiment. Replace every UNSET value and record
# measured values only after the measurement has actually been executed.
schema_version = 1
experiment_id = "UNSET"
created_utc = "UNSET"
status = "not_run" # not_run | running | completed | failed | interrupted
outcome = "UNSET"

[model]
identifier = "UNSET"
source_format = "UNSET"
source_hash_sha256 = "UNSET" # UNSET only when no source artifact exists or hashing was unavailable
license = "UNSET"
fixture_description = "UNSET"

[transformation]
name = "UNSET"
version = "UNSET"
configuration = "UNSET"
random_seed = -1 # replace with the actual seed; -1 means not yet specified

[hardware]
os = "UNSET"
cpu = "UNSET"
logical_processors = -1
system_memory_bytes = -1
